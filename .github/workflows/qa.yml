name: backend-qa

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          target: "."
          # Set AI_GATEWAY_API_KEY in repo secrets for full PAL adjudication;
          # without it the scan still runs and findings stay unadjudicated.
          gateway-key: ${{ secrets.AI_GATEWAY_API_KEY }}
          suggest-fixes: "true"
