[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-backend-qa"
version = "2.0.0"
description = "Backend QA agent for Jev-powered builds — deterministic scans, PAL-adjudicated verdicts, Rostr-native."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Diamitani Industries" }]
keywords = ["qa", "backend", "jev", "langchain", "rostr", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
agent = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
]
dev = [
    "pytest>=8",
]

[project.scripts]
jev-qa = "agent.cli:main"

[project.urls]
Homepage = "https://github.com/diamitani/jev-backend-qa"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.setuptools.package-data]
agent = ["jev_bridge.mjs", "package.json"]
